# Off-template questions a judge might type into ./ask.sh (ROADMAP item 18).
# Concepts come from taxonomy/classes.yaml labels/synonyms and graph node names (causal_graph.json).
#
# cause / outcome: the spans the `freeform` parser must return (compared case-insensitively).
# classes: the class ids a correct link would pick, judged by hand from the class descriptions
#   (null where more than one class is defensible). Linking is the linker's job; these are recorded
#   for experiments/ask/results.json and tests check only the parse.
# unclear: vague questions; `ask` must refuse with a clarification message and exit 2.
items:
  - id: OT-01
    question: Does mulching lead to more invasive plants?
    cause: mulching
    outcome: invasive plants
    classes: {cause: mulch_surface_cover, outcome: invasive_abundance}
  - id: OT-02
    question: Is native plant cover affected by grazing?
    cause: grazing
    outcome: native plant cover
    classes: {cause: grazing_browsing, outcome: native_abundance}
  - id: OT-03
    question: What happens to the water table after rewetting?
    cause: rewetting
    outcome: water table
    classes: {cause: peatland_rewetting, outcome: water_table_level}
  - id: OT-04
