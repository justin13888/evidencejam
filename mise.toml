# Dev tooling. Not needed to run the pipeline (./run.sh works with plain python3 + pip, or uv).
[tools]
python = "3.12"
hk = "2.11.1"
pkl = "0.33.0"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.setup]
description = "Install dev deps (editable) and git hooks"
run = [
  "if command -v uv >/dev/null; then uv pip install -q -e . -r requirements-dev.txt; else python -m pip install -q -e . -r requirements-dev.txt; fi",
  "hk install",
]

[tasks.lint]
run = ["ruff check .", "ruff format --check ."]

[tasks.test]
description = "Fast contract + unit tests"
run = "pytest -m 'not robust'"

[tasks.robust]
description = "Judging-scenario robustness: fake LLM fault modes, fuzzed inputs, timing"
run = "pytest -m robust"

[tasks.run]
run = "./run.sh questions.yaml outputs/answers.json"

[tasks.validate]
depends = ["run"]
run = "python -m camoreasoning validate outputs/answers.json --questions questions.yaml"

[tasks.ask]
usage = 'arg "<question>"'
run = './ask.sh "$usage_question"'

[tasks.eval]
description = "Score the pipeline on the dev split of experiments/devsets: pooled, then per file under by_file"
run = "python -m camoreasoning eval --split dev"

[tasks."eval:class"]
description = "Dev split of class_gold.yaml only (hidden-set wording): the number to report for default flips"
run = "python -m camoreasoning eval --split dev experiments/devsets/class_gold.yaml"

[tasks."eval:node"]
description = "Dev split of gold_annotated.yaml only (node wording, taxonomy-free): linking stress test"
run = "python -m camoreasoning eval --split dev experiments/devsets/gold_annotated.yaml"

[tasks."eval:holdout"]
description = "Score on the holdout split only. Run once at the audit and report; never tune on it"
run = "python -m camoreasoning eval --split holdout"

[tasks.profile]
description = "Profile the CAMO graph -> experiments/results/graph_profile.json"
run = "python -m camoreasoning profile"

[tasks."taxonomy:build"]
description = "Offline: build taxonomy/classes.yaml + taxonomy/node_labels.jsonl"
run = "python -m camoreasoning taxonomy"

[tasks."devset:build"]
description = "Offline: generate dev questions and gold labels into experiments/devsets/"
run = "python -m camoreasoning devset"

[tasks."run:fixture"]
description = "Run on the test fixture taxonomy (real answered traces + pages before taxonomy v1 exists)"
env = { CAMOREASONING_TAXONOMY_DIR = "tests/fixtures/taxonomy" }
run = "./run.sh tests/fixtures/devset/questions.yaml outputs/answers.json"

[tasks."eval:fixture"]
description = "Smoke the eval/oracle/scorecard code paths on the fixture devset (never tune on it)"
env = { CAMOREASONING_TAXONOMY_DIR = "tests/fixtures/taxonomy" }
run = "python -m camoreasoning eval tests/fixtures/devset/gold_fixture.yaml"

[tasks.calibrate]
description = "Fit the selected calibrator on gold dev items -> experiments/calibration/<name>.json"
run = "python -m camoreasoning calibrate"

[tasks.probe]
description = "Endpoint facts: usage reporting, thinking-off, JSON schema, prefix cache, latency"
run = "python -m camoreasoning probe"

[tasks.annotate]
description = "Labelling harness: mise run annotate <export|check|merge|run|review-export|review-import> <task> [flags]"
run = "python -m camoreasoning annotate"

[tasks.a11y]
description = "WCAG 2.2 AA static audit of the generated pages and style.css (also run by the tests)"
depends = ["run"]
run = "python scripts/a11y_audit.py outputs"

[tasks."a11y:axe"]
description = "Dev only, not in check: the static audit plus pinned axe-core in jsdom (needs node + npm)"
depends = ["run"]
run = "python scripts/a11y_audit.py outputs --axe"

[tasks.check]
description = "Gate for every change"
depends = ["lint", "test", "validate"]

[tasks.ci]
depends = ["check", "robust", "eval"]

[tasks.clean-run]
description = "Fresh clone of HEAD -> ./run.sh -> validate"
run = "scripts/clean_run.sh"

[tasks.judge-sim]
description = "Clean run inside an ARM64 python:3.10 container, then offline with a dead LLM"
run = "scripts/judge_sim.sh"
